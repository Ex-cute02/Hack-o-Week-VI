services:
  postgres:
    image: postgres:16
    container_name: campuspulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campuspulse
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: campuspulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pg_data:
